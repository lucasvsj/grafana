apiVersion: 1

# Lista de datasources que se provisionarán automáticamente
# Más info: https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources

datasources:
  # Prometheus - Datasource principal
  - name: Prometheus
    # UID fijo: los dashboards (PC-Hardware-Metrics.json) referencian este UID.
    # Sin fijarlo, un volumen nuevo generaría otro UID y los paneles quedarían
    # huérfanos del datasource.
    uid: PBFA97CFB590B2093
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

  # TestData (datasource de ejemplo para testing)
  - name: TestData
    type: testdata
    access: proxy
    isDefault: false
    editable: false
