apiVersion: 1

# Lista de datasources que se provisionarán automáticamente
# Más info: https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources

datasources:
  # Prometheus - Datasource principal
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

  # TestData (datasource de ejemplo para testing)
  - name: TestData
    type: testdata
    access: proxy
    isDefault: false
    editable: false
