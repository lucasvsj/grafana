version: '3.8'

services:
  # ==============================================
  # GRAFANA
  # ==============================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    
    environment:
      # Configuración básica
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3948}
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-localhost}
      - GF_SERVER_HTTP_PORT=3948
      
      # Credenciales de admin
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
      
      # Autenticación
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_DISABLE_SIGNOUT_MENU=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      
      # Anonimous access (disabled for security)
      - GF_AUTH_ANONYMOUS_ENABLED=false
      
      # API configuration
      - GF_SECURITY_ADMIN_API_KEY_ONLY=false
      - GF_USERS_DEFAULT_THEME=dark
      
      # Security
      - GF_SECURITY_COOKIE_SECURE=${GRAFANA_COOKIE_SECURE:-true}
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=${GRAFANA_STRICT_TRANSPORT_SECURITY:-true}
      
      # Logs
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=${GRAFANA_LOG_LEVEL:-info}
      
      # SMTP (optional)
      - GF_SMTP_ENABLED=${SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${SMTP_HOST:-}
      - GF_SMTP_USER=${SMTP_USER:-}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-grafana@localhost}
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    
    # Bind a 127.0.0.1 para que el acceso directo al puerto solo sea posible
    # desde el host mismo — el acceso externo siempre pasa por Traefik.
    ports:
      - "127.0.0.1:3948:3948"

    networks:
      - monitoring-network
      - traefik_network

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"

      # Router HTTPS — admin-chain@file añade rate-limit estricto + headers
      - "traefik.http.routers.grafana-https.rule=Host(`grafana.lucasvsj.com`)"
      - "traefik.http.routers.grafana-https.entrypoints=websecure"
      - "traefik.http.routers.grafana-https.tls=true"
      - "traefik.http.routers.grafana-https.tls.certresolver=cloudflare"
      - "traefik.http.routers.grafana-https.middlewares=admin-chain@file"

      # Service
      - "traefik.http.services.grafana.loadbalancer.server.port=3948"
    
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3948/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==============================================
  # PROMETHEUS
  # ==============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      # --web.enable-admin-api removido: permitía DELETE /api/v1/admin/tsdb/* sin auth,
      # lo que posibilitaba borrar toda la data de métricas desde internet.
    
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts:/etc/prometheus/alerts
    
    # Bind a 127.0.0.1 — Prometheus no tiene auth propia, acceso solo vía Traefik.
    ports:
      - "127.0.0.1:9090:9090"

    networks:
      - monitoring-network
      - traefik_network

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"

      # Router HTTPS con basicauth + admin-chain (rate-limit estricto + headers).
      # PROMETHEUS_PASSWORD_HASH: generar con `htpasswd -nB usuario` y poner en .env.
      - "traefik.http.routers.prometheus-https.rule=Host(`prometheus.lucasvsj.com`)"
      - "traefik.http.routers.prometheus-https.entrypoints=websecure"
      - "traefik.http.routers.prometheus-https.tls=true"
      - "traefik.http.routers.prometheus-https.tls.certresolver=cloudflare"
      - "traefik.http.routers.prometheus-https.middlewares=prometheus-auth,admin-chain@file"
      - "traefik.http.middlewares.prometheus-auth.basicauth.users=${PROMETHEUS_PASSWORD_HASH}"

      # Service
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==============================================
  # NODE EXPORTER - METRICAS DEL HOST
  # ==============================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - monitoring-network

# ==============================================
# VOLUMES
# ==============================================
volumes:
  grafana-data:
    driver: local
  prometheus-data:
    driver: local

# ==============================================
# NETWORKS
# ==============================================
networks:
  monitoring-network:
    driver: bridge
  
  traefik_network:
    external: true
